name: Publish learning site

on:
  push:
    branches: [main]
    paths:
      - "assets/learning/**"
      - "lessons/**"
      - "reference/**"
      - "web/scripts/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:learning-site
      - run: npm run check:learning-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-learning

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
