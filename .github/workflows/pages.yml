name: Publish learning site

on:
  push:
    # The active integration branch is the source of the currently published
    # curriculum until its work is merged to main.  Keep this explicit rather
    # than deploying arbitrary feature branches.
    branches: [main, codex/preparation-foundation]
    paths:
      - "assets/learning/**"
      - "lessons/**"
      - "reference/**"
      - "web/scripts/**"
      - "web/package.json"
      - "web/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      # Repository-document links in the generated site must resolve to the
      # exact commit that produced the deployed artifact.
      LEARNING_SITE_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:learning-site
      - run: npm run check:learning-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist-learning

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
